name: Publish to npm 🚀

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish (versions already on npm are skipped)
        required: true
        type: choice
        default: all
        options:
          - all
          - blog-core
          - blog-firebase
          - blog-layer
          - blog-admin-layer
          - blog-site-layer
          - blog-deploy
      dry-run:
        description: Pack and check only, publish nothing
        type: boolean
        default: false

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: Development # must match the environment of each package's npm trusted publisher
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # npm stage publish needs npm 11.15 or later; Node 24 ships an older one
      - name: Install npm
        run: npm install -g npm@11.21.0

      - name: Check package versions are in step
        run: |
          node -e "
            const { readdirSync, readFileSync } = require('node:fs')
            const versions = readdirSync('packages').map(dir => [dir, JSON.parse(readFileSync('packages/' + dir + '/package.json', 'utf8')).version])
            const distinct = new Set(versions.map(([, version]) => version))
            if (distinct.size > 1) { console.error(versions.map(v => v.join(' ')).join('\n')); process.exit(1) }
            console.log('All packages at', [...distinct][0])
          "

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare the playgrounds
        run: pnpm run postinstall

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # pnpm pack rewrites workspace:^ dependencies and publishConfig; npm stages the tarball through OIDC
      # and each version waits for approval in the npmjs.com Staged Packages tab
      - name: Publish
        env:
          SELECTED: ${{ inputs.package }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/packs"
          for pkg in blog-core blog-firebase blog-layer blog-admin-layer blog-site-layer blog-deploy; do
            if [ "$SELECTED" != all ] && [ "$SELECTED" != "$pkg" ]; then
              continue
            fi
            name=$(node -p "require('./packages/$pkg/package.json').name")
            version=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "::notice::$name@$version is already on npm, skipped"
              continue
            fi
            tarball=$(cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/packs" | tail -1)
            if [ "$DRY_RUN" = true ]; then
              npm stage publish "$tarball" --access public --dry-run
            else
              npm stage publish "$tarball" --access public --provenance
              echo "::notice::Staged $name@$version: approve it on npmjs.com"
            fi
          done
